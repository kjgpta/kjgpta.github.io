      <line x1="11.8" y1="15.6" x2="22.4" y2="9.4" stroke-width="2.9"/>
      <line x1="11.8" y1="15.6" x2="22.8" y2="22.4" stroke-width="3.3"/>
    </g>
    <rect x="19.4" y="8" width="6.9" height="2.4"/>
    <rect x="19.6" y="21.6" width="7" height="2.4"/>
  </g>
</svg>
