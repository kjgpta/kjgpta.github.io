<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="K">
  <rect width="32" height="32" fill="#A33B22"/>
  <g transform="translate(-0.4 0)" fill="#F4F1E9">
    <!-- Stem, with slab serifs at cap line and baseline -->
    <path d="M7 8h7.6v1.9h-2.1v12.2h2.1V24H7v-1.9h2.4V9.9H7z"/>
